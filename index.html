<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Missing Invoice Finder</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- ExcelJS for reading Excel cell styles & fill colors -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen py-10 px-4">
  <div class="max-w-2xl mx-auto bg-white rounded-2xl shadow-sm border border-slate-200 p-8">
    <div class="flex items-center space-x-3 mb-2">
      <span class="text-3xl">📄</span>
      <h1 class="text-2xl font-bold text-slate-900">Missing Invoice Finder</h1>
    </div>
    <p class="text-slate-500 mb-6 text-sm">
      Upload your Excel file (<code class="bg-slate-100 px-1 rounded">.xlsx</code>). The app detects yellow-highlighted invoice numbers and finds any gaps in your chosen range.
    </p>

    <!-- File Upload -->
    <div class="mb-6">
      <label class="block text-sm font-semibold text-slate-700 mb-2">Upload Excel File</label>
      <input 
        type="file" 
        id="excelFile" 
        accept=".xlsx"
        class="block w-full text-sm text-slate-500 file:mr-4 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer border border-slate-300 rounded-xl"
      />
    </div>

    <!-- Sheet Selection -->
    <div id="sheetSelectionDiv" class="mb-6 hidden">
      <label class="block text-sm font-semibold text-slate-700 mb-2">Select Sheet</label>
      <select id="sheetSelect" class="w-full border border-slate-300 rounded-xl px-4 py-2.5 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-500"></select>
    </div>

    <!-- Range Inputs -->
    <div id="rangeDiv" class="hidden">
      <div id="detectedStatus" class="p-3 mb-6 rounded-xl bg-blue-50 border border-blue-200 text-blue-800 text-sm"></div>

      <div class="grid grid-cols-2 gap-4 mb-6">
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1">Start Invoice Number</label>
          <input type="number" id="startNum" class="w-full border border-slate-300 rounded-xl px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1">End Invoice Number</label>
          <input type="number" id="endNum" class="w-full border border-slate-300 rounded-xl px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>
      </div>

      <button id="findBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-xl transition duration-150">
        🔍 Find Missing Invoices
      </button>
    </div>

    <!-- Results Section -->
    <div id="resultsDiv" class="mt-8 hidden">
      <hr class="border-slate-200 mb-6" />
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-lg font-bold text-slate-900" id="resultHeading">Results</h2>
        <button id="downloadBtn" class="hidden bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-semibold px-4 py-2 rounded-xl transition">
          📥 Download CSV
        </button>
      </div>

      <div id="resultMessage" class="mb-4 text-sm font-medium"></div>

      <div class="max-h-60 overflow-y-auto border border-slate-200 rounded-xl hidden" id="tableContainer">
        <table class="w-full text-left text-sm">
          <thead class="bg-slate-100 text-slate-700 sticky top-0">
            <tr>
              <th class="py-2.5 px-4 font-semibold">Missing Invoice Number</th>
            </tr>
          </thead>
          <tbody id="missingTableBody" class="divide-y divide-slate-100 bg-white"></tbody>
        </table>
      </div>
    </div>
  </div>
